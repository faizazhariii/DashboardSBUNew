<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mini Web ED REG Sumbagut</title>
<meta name="theme-color" content="#0B1F3A">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F4F9; --panel:#fff; --panel2:#F7F9FC; --line:#DFE5EE; --text:#0F1B2D; --dim:#4A5568; --faint:#8793A6;
    --navy:#0B1F3A; --navy2:#16406F; --red:#D9202B; --track:#E6EBF3;
    --ok:#167A4B; --ogp:#0B5CAB; --drop:#D7141A; --warn:#C27A0A;
    --okbg:#E1F4EA; --ogpbg:#E4EEFA; --dropbg:#FBE4E5; --warnbg:#FFF0D6;
    --shadow:0 1px 2px rgba(11,31,58,.05),0 6px 18px rgba(11,31,58,.06);
  }
  :root[data-theme=dark]{
    --bg:#0A121F; --panel:#121D2E; --panel2:#18263B; --line:#233349; --text:#EAF0F8; --dim:#B3BFD1; --faint:#7C8CA3;
    --navy:#050B14; --navy2:#0F2A4A; --track:#223148;
    --ok:#3FCB86; --ogp:#5AA6F2; --drop:#FF6B72; --warn:#F2B04C;
    --okbg:#12392A; --ogpbg:#12304F; --dropbg:#43191D; --warnbg:#433115;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  .app{max-width:560px;margin:0 auto;}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2) 70%,#1d5a99);color:#fff;padding:16px 16px 56px;position:relative;border-bottom:3px solid var(--red);}
  .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9CC0EA;font-weight:600;margin:0;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:3px 0 0;font-weight:700;line-height:1.2;}
  .hi{font-size:12.5px;color:#C9D7EA;margin-top:4px;}
  .rbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;}
  .rbtn:active{background:rgba(255,255,255,.28);} .rbtn svg{width:19px;height:19px;} .rbtn.spin svg{animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .stamp{font-size:11px;color:#B9C7DB;margin-top:8px;display:flex;align-items:center;gap:6px;}
  .stamp i{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;}
  main{padding:0 14px 20px;margin-top:-40px;position:relative;}
  .view{display:none;} .view.on{display:block;animation:fd .25s ease;}
  @keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
  .sec{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;margin:20px 2px 9px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .sec:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--red);}
  .sec small{margin-left:auto;font:500 11.5px 'Inter';color:var(--faint);}
  /* hero */
  .hero{display:flex;gap:14px;align-items:center;}
  .ring{position:relative;width:112px;height:112px;flex:0 0 auto;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
  .ring .c b{font-family:'Space Grotesk';font-size:25px;line-height:1;} .ring .c span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;font-weight:600;}
  .hero .kp{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .k{border-radius:12px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;}
  .k:active{transform:scale(.97);}
  .k b{display:block;font-family:'Space Grotesk';font-size:21px;line-height:1.1;} .k span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .k.ok b{color:var(--ok);} .k.og b{color:var(--ogp);} .k.dr b{color:var(--drop);}
  /* source cards */
  .src{cursor:pointer;} .src:active{background:var(--panel2);}
  .src .top{display:flex;align-items:center;gap:10px;}
  .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--ogpbg);flex:0 0 auto;}
  .src .nm{font-weight:700;font-size:15px;} .src .tot{font-size:11.5px;color:var(--faint);}
  .src .pc{margin-left:auto;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--ok);line-height:1;} .src .pc small{display:block;font:600 10px Inter;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
  .bar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--track);margin:11px 0 9px;gap:2px;}
  .bar i{display:block;height:100%;border-radius:3px;}
  .legend{display:flex;gap:6px;font-size:12px;color:var(--dim);flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-weight:600;font-size:11.5px;cursor:pointer;}
  .pill.ok{background:var(--okbg);color:var(--ok);} .pill.og{background:var(--ogpbg);color:var(--ogp);} .pill.dr{background:var(--dropbg);color:var(--drop);} .pill.wr{background:var(--warnbg);color:var(--warn);}
  .pill b{font-weight:700;}
  /* komitmen */
  .kom{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .kom:last-child{border-bottom:none;padding-bottom:2px;} .kom:first-child{padding-top:2px;}
  .kom .n{width:58px;font-weight:700;font-size:13.5px;} .kom .m{flex:1;min-width:0;}
  .kom .t{font-size:11.5px;color:var(--dim);margin-bottom:5px;}
  .pbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;} .pbar i{display:block;height:100%;border-radius:5px;}
  .kom .p{width:50px;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  /* attention */
  .att{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);}
  .att:active{background:var(--panel2);}
  .att .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;}
  .att .at{flex:1;min-width:0;} .att .at b{display:block;font-size:14px;} .att .at span{font-size:12px;color:var(--faint);}
  .att .an{font-family:'Space Grotesk';font-weight:700;font-size:24px;}
  .rank{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;cursor:pointer;}
  .rank .rn{width:96px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .rank .rb{flex:1;height:8px;background:var(--track);border-radius:5px;overflow:hidden;} .rank .rb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ogp),#4C9BE8);} .rank .rv{width:34px;text-align:right;font-weight:700;}
  /* cek */
  .search{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px 0 6px;margin-top:6px;}
  .sbox{position:relative;} .sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);}
  .search input{width:100%;font:inherit;font-size:15px;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);outline:none;}
  .search input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(22,64,111,.15);}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff;}
  .chip.q{border-style:dashed;} .chip.q.on{background:var(--warn);border-color:var(--warn);}
  .tools{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 8px;font-size:12px;color:var(--faint);}
  .tools select{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:5px 8px;}
  .item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ogp);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);}
  .item:active{background:var(--panel2);}
  .item.golive{border-left-color:var(--ok);} .item.drop{border-left-color:var(--drop);}
  .item .t{font-weight:700;font-size:14px;line-height:1.3;} .item .s{font-size:12px;color:var(--faint);margin-top:3px;}
  .item .b{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ogpbg);color:var(--ogp);}
  .tag.golive{background:var(--okbg);color:var(--ok);} .tag.drop{background:var(--dropbg);color:var(--drop);} .tag.src{background:var(--navy2);color:#fff;} .tag.n{background:var(--panel2);color:var(--dim);border:1px solid var(--line);} .tag.late{background:var(--dropbg);color:var(--drop);} .tag.stale{background:var(--warnbg);color:var(--warn);}
  .more{display:block;width:100%;padding:12px;border:1px dashed var(--faint);background:transparent;border-radius:12px;color:var(--ogp);font-weight:600;font-size:13.5px;cursor:pointer;margin:6px 0 10px;}
  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(11,31,58,.1);}
  nav button{flex:1;border:none;background:none;font:inherit;padding:9px 6px 10px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
  nav button svg{width:22px;height:22px;} nav button.on{color:var(--ogp);} nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--red);}
  nav .bd{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:99px;font-size:9.5px;padding:1px 5px;font-weight:700;}
  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(5,11,20,.55);z-index:40;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--panel);border-radius:20px 20px 0 0;max-height:88vh;display:none;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.3);}
  .sheet.on,.sheet-bg.on{display:flex;} .sheet-bg.on{display:block;}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 0;}
  .sh-h{padding:10px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .sh-h .t{font-weight:700;font-size:15.5px;line-height:1.3;} .sh-h .st{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
  .sh-h .x{border:none;background:var(--panel2);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;flex:0 0 auto;}
  .sh-b{padding:12px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;}
  .acts{display:flex;gap:8px;margin-bottom:12px;} .acts button{flex:1;font:inherit;font-weight:600;font-size:13px;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;}
  .acts button.pri{background:var(--navy2);border-color:var(--navy2);color:#fff;}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;font-size:13px;margin-bottom:12px;}
  .kv dt{color:var(--faint);font-weight:600;} .kv dd{margin:0;word-break:break-word;}
  .tl{position:relative;margin:4px 0 4px 6px;padding-left:16px;border-left:2px solid var(--line);}
  .tl div{position:relative;font-size:13px;line-height:1.5;padding:0 0 11px;} .tl div:before{content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ogp);border:2px solid var(--panel);}
  .tl div:first-child:before{background:var(--ok);}
  .err{background:var(--dropbg);color:var(--drop);border-radius:12px;padding:10px 12px;font-size:12.5px;margin:0 0 10px;}
  .empty{text-align:center;color:var(--faint);padding:30px 10px;font-size:13.5px;}
  .sk{height:92px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,var(--track) 25%,var(--panel2) 50%,var(--track) 75%);background-size:200% 100%;animation:sh 1.2s infinite;}
  @keyframes sh{to{background-position:-200% 0}}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:.25s;}
  .toast.on{opacity:1;}
</style>
</head>

<script>
(function(){
const SS = '1PGH5LCx2zyFn2ps8J9kJ93tc6KjnLc1Hof1F2SB8DBM';
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRY6Kk4y76AknMk8g7e9i-vp1aUnrDoyixjs0QtdBoeO82X8zyJjpNoemMFAmAHUXSEdv3Upaj4otlh/pub';
const gviz = (gid)=> `https://docs.google.com/spreadsheets/d/${SS}/gviz/tq?tqx=out:csv&gid=${gid}`;
const exp = (gid)=> `https://docs.google.com/spreadsheets/d/${SS}/export?format=csv&gid=${gid}`;

const tg = window.Telegram && window.Telegram.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

const MON = {jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,agt:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
function parseDMY(str){
  if(!str || str === '-') return null;
  let p = str.toString().trim().split(/[\/\-\s]+/).filter(Boolean);
  if(p.length === 2 && /^\d{1,2}$/.test(p[0]) && isNaN(parseInt(p[1])) && MON[p[1].slice(0,3).toLowerCase()] !== undefined) p.push(String(new Date().getFullYear()));
  if(p.length !== 3) return null;
  let [d,m,y] = p;
  if(isNaN(parseInt(m))){
    const mi = MON[m.slice(0,3).toLowerCase()]; if(mi === undefined) return null;
    let yr = parseInt(y); if(y.length === 2) yr += 2000;
    const dt = new Date(yr, mi, parseInt(d)); return isNaN(dt) ? null : dt;
  }
  if(y.length === 2) y = '20' + y;
  const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d)); return isNaN(dt) ? null : dt;
}
const strip = (l)=> (l||'').replace(/^\s*\d+[\.\-\)]?\s*/, '').trim() || (l||'');
const isDropNum = (l)=> /^\s*0\b/.test(l||'');

/* ---------- Konfigurasi tiap sumber ---------- */
const SOURCES = [
  { key:'PT3 TA', urls:[gviz(1041674095), exp(1041674095)], req:'ID-IHLD',
    f:{ id:'ID-IHLD', nama:'NAMA LOP', branch:'BRANCH FMC', sto:'STO', status:'Status', komit:'KOMITMEN GOLIVE', detail:'DETAIL STATUS' },
    extra:[['Mitra','MITRA'],['Port Plan','PORT PLAN'],['Prioritas Tsel','PRIORITAS 1 BY TSEL'],['Status Golive','STATUS GOLIVE']],
    cat:(g)=>{ const st = g('Status'); if(isDropNum(st)) return 'drop'; if(strip(st).toUpperCase()==='UJI TERIMA' || g('STATUS GOLIVE').toUpperCase()==='GOLIVE') return 'golive'; return 'ogp'; } },
  { key:'PT3 FH', urls:[gviz(745436831), exp(745436831)], req:'ID-IHLD',
    f:{ id:'ID-IHLD', nama:'NAMA LOP', branch:'BRANCH FMC', sto:'STO', status:'Status', komit:'KOMITMEN GOLIVE', detail:'DETAIL STATUS' },
    extra:[['Mitra','MITRA'],['Port Plan','PORT PLAN'],['Prioritas Tsel','PRIORITAS 1 BY TSEL']],
    cat:(g)=>{ const st = g('Status'); if(isDropNum(st)) return 'drop'; const s = strip(st).toUpperCase(); if(s==='GOLIVE'||s==='UJI TERIMA'||s==='REKON') return 'golive'; return 'ogp'; } },
  { key:'HEM', urls:[PUB+'?gid=277538737&single=true&output=csv', PUB+'?output=csv'], req:'IHLD',
    f:{ id:'IHLD', nama:'NAMA LOP', branch:'DISTRICT', sto:'STO', status:'Progress Lapangan', komit:'Komitmen Golive', detail:'Detail Progres' },
    extra:[['Witel','WITEL'],['Tgl Submit NDE','Tanggal submit order nde'],['Catatan','CATATAN']],
    cat:(g)=>{ const s = strip(g('Progress Lapangan')).toUpperCase(); if(['GOLIVE','UJI TERIMA','ON AIR'].includes(s)) return 'golive'; if(['DROP','PROPOSED DROP','APPROVED DROP'].includes(s)) return 'drop'; return 'ogp'; } },
  { key:'OLO', urls:[PUB+'?gid=1782023053&single=true&output=csv'], req:'IHLD',
    f:{ id:'IHLD', nama:'NAMA PROYEK', branch:'DISTRICT', sto:'STO', status:'Progress Lapangan', komit:'Komitmen Golive', detail:'Detail Progres' },
    extra:[['No Order','NO ORDER'],['Service','SERVICE'],['BW','BW'],['Catatan','CATATAN']], search:['NO ORDER'],
    cat:(g)=>{ const s = strip(g('Progress Lapangan')).toUpperCase(); if(['GOLIVE','UJI TERIMA','ON AIR'].includes(s)) return 'golive'; if(['DROP','PROPOSED DROP','APPROVED DROP'].includes(s)) return 'drop'; return 'ogp'; } },
  { key:'MBB', urls:[gviz(264409897), exp(264409897)], req:'SITE ID',
    f:{ id:'ID', nama:'SITE NAME', branch:'BRANCH', sto:'STO', status:'STATUS', komit:'TGL COMMIT OA FIX', detail:'DETIL PROGRESS' },
    extra:[['Site ID','SITE ID'],['SOW Order','SOW ORDER'],['Sub Status','SUB STATUS'],['Mitra','MITRA'],['Catatan','CATATAN']], search:['SITE ID'],
    cat:(g)=>{ const m = (g('STATUS')||'').match(/^\s*(\d+)/); const n = m ? parseInt(m[1],10) : -1; if(n===0) return 'drop'; if(n===6||n===7) return 'golive'; return 'ogp'; } },
  { key:'QE', urls:[gviz(2018392112), exp(2018392112)], req:'NAMA LOP', region:{col:'REGION', val:'SBU'},
    f:{ id:'ID DIGASSS', nama:'NAMA LOP', branch:'DISTRICT TIF', sto:'STO', status:'STATUS PROGRES', komit:null, detail:'DETAIL STATUS' },
    extra:[['Batch','BATCH'],['Nilai Plan','NILAI PLAN'],['Nilai Realisasi','NILAI REALISASI'],['Subcon TA','SUBCON TA'],['Tim Waspang','Tim Waspang']],
    cat:(g)=>{ const s = strip(g('STATUS PROGRES')).toUpperCase(); if(s==='CLOSED') return 'golive'; if(s==='DROP') return 'drop'; return 'ogp'; } }
];
const CATLBL = { golive:'OA / Golive', ogp:'OGP', drop:'Drop' };
const norm = (s)=> (s||'').toString().replace(/\s+/g,' ').trim().toUpperCase();

let DATA = {};   // key -> [records]
let ERRS = {};
let loadedAt = null;

async function fetchText(urls){
  let last = null;
  for(const u of urls){
    try{
      const r = await fetch(u + (u.includes('?')?'&':'?') + '_=' + Date.now(), {cache:'no-store'});
      if(!r.ok){ last = new Error('HTTP ' + r.status); continue; }
      const t = await r.text();
      if(!t || t.trim().startsWith('<')){ last = new Error('Respons bukan CSV (sheet belum dibagikan?)'); continue; }
      return t;
    }catch(e){ last = e; }
  }
  throw last || new Error('gagal');
}
function build(src, text){
  const data = Papa.parse(text, {skipEmptyLines:true}).data;
  const hi = data.findIndex(r=> r.some(c=> norm(c) === src.req));
  if(hi < 0) throw new Error('header "' + src.req + '" tidak ditemukan');
  const map = {}; data[hi].forEach((h,i)=>{ if(!(norm(h) in map)) map[norm(h)] = i; });
  const out = [];
  data.slice(hi+1).forEach(row=>{
    const g = (n)=>{ const i = map[norm(n)]; return i === undefined ? '' : ((row[i]||'')+'').trim(); };
    if(src.region && g(src.region.col).toUpperCase() !== src.region.val) return;
    const nama = g(src.f.nama); if(!nama && !g(src.f.id)) return;
    const rec = {
      src: src.key, id: g(src.f.id), nama: nama || '(tanpa nama)', branch: g(src.f.branch), sto: g(src.f.sto),
      status: strip(g(src.f.status)) || 'Tidak diketahui', komit: src.f.komit ? g(src.f.komit) : '', detail: g(src.f.detail),
      cat: src.cat(g), extra: src.extra.map(([l,c])=>[l, g(c)]).filter(x=>x[1])
    };
    rec.hay = [rec.id, rec.nama, rec.sto, rec.branch, rec.status].concat((src.search||[]).map(g)).join(' ').toLowerCase();
    out.push(rec);
  });
  return out;
}
async function loadAll(){
  document.getElementById('btnRefresh').disabled = true; document.getElementById('btnRefresh').classList.add('spin');
  document.getElementById('stamp').textContent = 'Memuat data...';
  ERRS = {};
  await Promise.all(SOURCES.map(async s=>{
    try{ DATA[s.key] = build(s, await fetchText(s.urls)); }
    catch(e){ ERRS[s.key] = e.message || String(e); if(!DATA[s.key]) DATA[s.key] = []; }
  }));
  loadedAt = new Date();
  document.getElementById('btnRefresh').disabled = false; document.getElementById('btnRefresh').classList.remove('spin');
  document.getElementById('stamp').textContent = 'Diperbarui ' + loadedAt.toLocaleString('id-ID', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const keys = Object.keys(ERRS);
  document.getElementById('errBox').innerHTML = keys.length ? `<div class="err">Gagal memuat: ${keys.map(k=>k+' ('+ERRS[k]+')').join(', ')}. Cek apakah sheet sudah dibagikan / dipublish.</div>` : '';
  renderAll();
}


/* ---------- Util ---------- */
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const STALE_DAYS = 25;
const esc = (t)=> (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today0 = ()=>{ const d = new Date(); d.setHours(0,0,0,0); return d; };
const SRC_ICON = { 'PT3 TA':'📡','PT3 FH':'🧵','HEM':'🏠','OLO':'🏢','MBB':'📶','QE':'🏗️' };
function lastUpdate(text){
  if(!text) return null;
  const now = today0(); let latest = null, m;
  const re = /\(?\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})\)?/g;
  while((m = re.exec(text)) !== null){
    const day = +m[1], mon = +m[2]; if(day<1||day>31||mon<1||mon>12) continue;
    let d = new Date(now.getFullYear(), mon-1, day); if(d > now) d = new Date(now.getFullYear()-1, mon-1, day);
    if(!latest || d > latest) latest = d;
  }
  const re2 = /\b(\d{1,2})[\s\/\-]*(jan|feb|mar|apr|mei|may|jun|jul|agu|agt|aug|sep|okt|oct|nov|des|dec)[a-z]*/gi;
  while((m = re2.exec(text)) !== null){
    const mon = MON[m[2].toLowerCase()]; if(mon === undefined) continue;
    let d = new Date(now.getFullYear(), mon, +m[1]); if(d > now) d = new Date(now.getFullYear()-1, mon, +m[1]);
    if(!latest || d > latest) latest = d;
  }
  return latest;
}
function enrich(){
  const t0 = today0();
  SOURCES.forEach(s=> (DATA[s.key]||[]).forEach(r=>{
    const kd = parseDMY(r.komit); r.kd = kd;
    r.late = !!kd && kd < t0 && r.cat === 'ogp';
    const lu = lastUpdate(r.detail); r.age = lu ? Math.round((t0 - lu)/86400000) : -1;
    r.stale = r.cat === 'ogp' && r.age > STALE_DAYS;
  }));
}
function haptic(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(()=> t.classList.remove('on'), 1600); }
const state = { src:'', cat:'', q:'', quick:'', sort:'', limit:30 };
const allRecs = ()=>{ let a = []; SOURCES.forEach(s=> a = a.concat(DATA[s.key]||[])); return a; };
const cnt = (arr,k)=> arr.filter(r=> r.cat === k).length;
function goCek(patch){ Object.assign(state, {src:'',cat:'',q:'',quick:'',sort:'',limit:30}, patch||{}); document.getElementById('q').value = state.q; document.getElementById('sortSel').value = state.sort; show('cek'); renderCek(); haptic(); }

/* ---------- Ringkasan ---------- */
function ring(pct, col){
  const r = 46, c = 2*Math.PI*r, off = c*(1 - Math.min(pct,100)/100);
  return `<svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--track)" stroke-width="11"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function renderSum(){
  const now = new Date(), ym = [now.getFullYear(), now.getMonth()];
  const all = allRecs(), g = cnt(all,'golive'), o = cnt(all,'ogp'), d = cnt(all,'drop');
  const pct = all.length ? Math.round(g/all.length*100) : 0;
  let h = `<div class="card"><div class="hero"><div class="ring">${ring(pct,'var(--ok)')}<div class="c"><b>${pct}%</b><span>Golive</span></div></div>
    <div class="kp">
      <div class="k" data-go=""><b>${all.length.toLocaleString('id-ID')}</b><span>Total LoP</span></div>
      <div class="k ok" data-go="golive"><b>${g.toLocaleString('id-ID')}</b><span>OA / Golive</span></div>
      <div class="k og" data-go="ogp"><b>${o.toLocaleString('id-ID')}</b><span>OGP</span></div>
      <div class="k dr" data-go="drop"><b>${d.toLocaleString('id-ID')}</b><span>Drop</span></div></div></div></div>`;
  h += `<div class="sec">Per Kategori <small>ketuk untuk detail</small></div>`;
  SOURCES.forEach(s=>{
    const a = DATA[s.key]||[], t = a.length || 1, sg = cnt(a,'golive'), so = cnt(a,'ogp'), sd = cnt(a,'drop');
    h += `<div class="card src" data-src="${s.key}"><div class="top"><div class="ic">${SRC_ICON[s.key]||'📋'}</div><div><div class="nm">${s.key}</div><div class="tot">${a.length.toLocaleString('id-ID')} LoP</div></div>
      <div class="pc">${Math.round(sg/t*100)}%<small>Golive</small></div></div>
      <div class="bar"><i style="width:${sg/t*100}%;background:var(--ok)"></i><i style="width:${so/t*100}%;background:var(--ogp)"></i><i style="width:${sd/t*100}%;background:var(--drop)"></i></div>
      <div class="legend"><span class="pill ok" data-src="${s.key}" data-cat="golive">OA <b>${sg}</b></span><span class="pill og" data-src="${s.key}" data-cat="ogp">OGP <b>${so}</b></span><span class="pill dr" data-src="${s.key}" data-cat="drop">Drop <b>${sd}</b></span>${(a.filter(r=>r.late).length) ? `<span class="pill wr" data-src="${s.key}" data-quick="late">⚠ Terlewat <b>${a.filter(r=>r.late).length}</b></span>` : ''}</div></div>`;
  });
  h += `<div class="sec">Komitmen Golive — ${BULAN[ym[1]]} ${ym[0]}</div><div class="card">`;
  let any = false;
  SOURCES.filter(s=> s.f.komit).forEach(s=>{
    const km = (DATA[s.key]||[]).filter(r=> r.kd && r.kd.getFullYear()===ym[0] && r.kd.getMonth()===ym[1]);
    if(!km.length) return; any = true;
    const oa = km.filter(r=> r.cat==='golive').length, p = Math.round(oa/km.length*100);
    const col = p >= 100 ? 'var(--ok)' : (p >= 50 ? 'var(--warn)' : 'var(--drop)');
    h += `<div class="kom" data-src="${s.key}" data-quick="komitbulan"><div class="n">${s.key}</div><div class="m"><div class="t">${oa} OA dari ${km.length} komitmen</div><div class="pbar"><i style="width:${Math.min(p,100)}%;background:${col}"></i></div></div><div class="p" style="color:${col}">${p}%</div></div>`;
  });
  if(!any) h += `<div class="empty">Belum ada komitmen golive di bulan ini.</div>`;
  h += `</div>`;
  const el = document.getElementById('vSum'); el.innerHTML = h;
  el.querySelectorAll('[data-go]').forEach(x=> x.onclick = ()=> goCek({cat:x.dataset.go}));
  el.querySelectorAll('.pill').forEach(x=> x.onclick = (e)=>{ e.stopPropagation(); goCek({src:x.dataset.src, cat:x.dataset.cat||'', quick:x.dataset.quick||''}); });
  el.querySelectorAll('.kom').forEach(x=> x.onclick = ()=> goCek({src:x.dataset.src, quick:'komitbulan'}));
  el.querySelectorAll('.src').forEach(x=> x.onclick = ()=> goCek({src:x.dataset.src}));
}

/* ---------- Perhatian ---------- */
function renderAtt(){
  const all = allRecs(), late = all.filter(r=> r.late), stale = all.filter(r=> r.stale);
  const noUpd = all.filter(r=> r.cat==='ogp' && r.age < 0);
  const t0 = today0(), wk = new Date(t0.getTime() + 7*86400000);
  const soon = all.filter(r=> r.cat==='ogp' && r.kd && r.kd >= t0 && r.kd <= wk);
  const total = late.length + stale.length;
  const bd = document.getElementById('bdAtt'); bd.style.display = total ? '' : 'none'; bd.textContent = total > 99 ? '99+' : total;
  let h = `<div style="height:14px"></div>`;
  const card = (ic, bg, col, t, sub, n, quick)=> `<div class="att" data-quick="${quick}"><div class="ai" style="background:${bg};color:${col}">${ic}</div><div class="at"><b>${t}</b><span>${sub}</span></div><div class="an" style="color:${col}">${n}</div></div>`;
  h += card('⏰','var(--dropbg)','var(--drop)','Komitmen Terlewat','OGP yang tanggal komitmennya sudah lewat', late.length, 'late');
  h += card('⏱','var(--warnbg)','var(--warn)',`Belum Update > ${STALE_DAYS} hari`,'OGP dengan log progres terakhir sudah lama', stale.length, 'stale');
  h += card('📅','var(--ogpbg)','var(--ogp)','Komitmen 7 Hari ke Depan','OGP yang jatuh tempo dalam seminggu', soon.length, 'soon');
  h += card('📝','var(--panel2)','var(--dim)','Belum Ada Log Progres','OGP tanpa tanggal update terbaca', noUpd.length, 'nolog');
  // ranking branch OGP terlewat
  const by = {}; late.concat(stale.filter(r=> !r.late)).forEach(r=>{ const k = r.branch || 'Tidak diketahui'; by[k] = (by[k]||0) + 1; });
  const rk = Object.keys(by).map(k=>[k,by[k]]).sort((a,b)=> b[1]-a[1]).slice(0,6), mx = rk.length ? rk[0][1] : 1;
  if(rk.length){
    h += `<div class="sec">Branch / District Paling Banyak Bermasalah <small>terlewat + basi</small></div><div class="card">` +
      rk.map(([k,v])=> `<div class="rank" data-q="${esc(k)}"><div class="rn">${esc(k)}</div><div class="rb"><i style="width:${v/mx*100}%"></i></div><div class="rv">${v}</div></div>`).join('') + `</div>`;
  }
  const worst = stale.slice().sort((a,b)=> b.age - a.age).slice(0,5);
  if(worst.length){
    h += `<div class="sec">Paling Lama Tanpa Update</div>` + worst.map((r,i)=> itemHTML(r, 'w'+i)).join('');
  }
  const el = document.getElementById('vAtt'); el.innerHTML = h;
  el.querySelectorAll('.att').forEach(x=> x.onclick = ()=> goCek({quick:x.dataset.quick}));
  el.querySelectorAll('.rank').forEach(x=> x.onclick = ()=> goCek({q:x.dataset.q, cat:'ogp'}));
  el.querySelectorAll('.item').forEach(b=> b.onclick = ()=> openSheet(worst[+b.dataset.i.slice(1)]));
}

/* ---------- Cek Progress ---------- */
function chipRow(id, items, cur, onPick, cls){
  const el = document.getElementById(id);
  el.innerHTML = items.map(([v,l])=> `<button type="button" class="chip ${cls||''}${v===cur?' on':''}" data-v="${v}">${l}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=> b.onclick = ()=>{ onPick(b.dataset.v); haptic(); });
}
function itemHTML(r, i){
  const ageTag = r.cat==='ogp' && r.age >= 0 ? `<span class="tag ${r.stale?'stale':'n'}">${r.age === 0 ? 'Update hari ini' : r.age + ' hari lalu'}</span>` : '';
  const lateTag = r.late ? `<span class="tag late">⚠ Komit lewat</span>` : (r.komit ? `<span class="tag n">Komit ${esc(r.komit)}</span>` : '');
  return `<button type="button" class="item ${r.cat}" data-i="${i}">
      <div class="t">${esc(r.nama)}</div>
      <div class="s">${esc([r.id, r.sto, r.branch].filter(Boolean).join(' · '))}</div>
      <div class="b"><span class="tag src">${r.src}</span><span class="tag ${r.cat}">${esc(r.status)}</span>${lateTag}${ageTag}</div></button>`;
}
const QUICK = [['','Semua'],['komitbulan','📅 Komit Bulan Ini'],['late','⏰ Terlewat'],['stale','⏱ Basi >'+STALE_DAYS+'h'],['soon','🔜 7 Hari'],['nolog','📝 Tanpa Log']];
function quickPass(r){
  const q = state.quick; if(!q) return true;
  const now = new Date();
  if(q === 'komitbulan') return !!r.kd && r.kd.getFullYear()===now.getFullYear() && r.kd.getMonth()===now.getMonth();
  if(q === 'late') return r.late; if(q === 'stale') return r.stale;
  if(q === 'soon'){ const t0 = today0(), wk = new Date(t0.getTime()+7*86400000); return r.cat==='ogp' && !!r.kd && r.kd >= t0 && r.kd <= wk; }
  if(q === 'nolog') return r.cat==='ogp' && r.age < 0;
  return true;
}
let FILTERED = [];
function renderCek(){
  chipRow('chipsSrc', [['','Semua']].concat(SOURCES.map(s=>[s.key,s.key])), state.src, v=>{ state.src = v; state.limit = 30; renderCek(); });
  chipRow('chipsCat', [['','Semua Status'],['golive','✅ OA / Golive'],['ogp','🔵 OGP'],['drop','🔴 Drop']], state.cat, v=>{ state.cat = v; state.limit = 30; renderCek(); });
  chipRow('chipsQ', QUICK, state.quick, v=>{ state.quick = v; state.limit = 30; renderCek(); }, 'q');
  const q = state.q.trim().toLowerCase();
  let pool = []; SOURCES.forEach(s=>{ if(!state.src || state.src === s.key) pool = pool.concat(DATA[s.key]||[]); });
  FILTERED = pool.filter(r=> (!state.cat || r.cat === state.cat) && quickPass(r) && (!q || r.hay.includes(q)));
  if(state.sort === 'komit') FILTERED.sort((a,b)=> (a.kd ? a.kd.getTime() : 9e15) - (b.kd ? b.kd.getTime() : 9e15));
  else if(state.sort === 'stale') FILTERED.sort((a,b)=> b.age - a.age);
  else if(state.sort === 'nama') FILTERED.sort((a,b)=> a.nama.localeCompare(b.nama,'id'));
  document.getElementById('cnt').textContent = FILTERED.length.toLocaleString('id-ID') + ' LoP' + (q ? ' cocok' : '');
  const shown = FILTERED.slice(0, state.limit);
  let h = shown.map((r,i)=> itemHTML(r, i)).join('');
  if(!shown.length) h = `<div class="empty">Tidak ada LoP yang cocok.</div>`;
  if(FILTERED.length > shown.length) h += `<button type="button" class="more" id="more">Tampilkan lebih banyak (${FILTERED.length - shown.length} lagi)</button>`;
  const el = document.getElementById('list'); el.innerHTML = h;
  el.querySelectorAll('.item').forEach(b=> b.onclick = ()=> openSheet(shown[+b.dataset.i]));
  const m = document.getElementById('more'); if(m) m.onclick = ()=>{ state.limit += 30; renderCek(); };
}
document.getElementById('q').oninput = (e)=>{ state.q = e.target.value; state.limit = 30; renderCek(); };
document.getElementById('sortSel').onchange = (e)=>{ state.sort = e.target.value; renderCek(); };

/* ---------- Detail ---------- */
function openSheet(r){
  document.getElementById('shT').textContent = r.nama;
  document.getElementById('shS').innerHTML = `<span class="tag src">${r.src}</span><span class="tag ${r.cat}">${esc(r.status)}</span>${r.late?'<span class="tag late">⚠ Komit lewat</span>':''}${r.stale?`<span class="tag stale">${r.age} hari tanpa update</span>`:''}`;
  const rows = [['ID', r.id],['Branch / District', r.branch],['STO', r.sto],['Kategori', CATLBL[r.cat]],['Komitmen Golive', r.komit],['Update Terakhir', r.age >= 0 ? (r.age === 0 ? 'Hari ini' : r.age + ' hari lalu') : '']].concat(r.extra).filter(x=>x[1]);
  const lines = (r.detail||'').split(/\n+|\s{2,}|;\s+(?=\(?\d)/).map(s=>s.trim()).filter(Boolean);
  document.getElementById('shB').innerHTML =
    `<div class="acts"><button type="button" class="pri" id="cpId">📋 Salin ID</button><button type="button" id="cpAll">📝 Salin Ringkasan</button></div>` +
    `<dl class="kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` +
    `<div class="sec" style="margin-top:4px">Riwayat Progres</div>` +
    (lines.length ? `<div class="tl">${lines.map(l=>`<div>${esc(l)}</div>`).join('')}</div>` : `<div class="empty" style="padding:14px">Belum ada detail progres.</div>`);
  const copy = (txt, msg)=>{ (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ toast(msg); haptic('medium'); }).catch(()=>{ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg); }catch(e){} ta.remove(); }); };
  document.getElementById('cpId').onclick = ()=> copy(r.id || r.nama, 'ID disalin');
  document.getElementById('cpAll').onclick = ()=> copy(`${r.src} | ${r.id} | ${r.nama}\n${r.branch} · ${r.sto}\nStatus: ${r.status}${r.komit ? '\nKomitmen: ' + r.komit : ''}\n${r.detail || ''}`, 'Ringkasan disalin');
  document.getElementById('bg').classList.add('on'); document.getElementById('sheet').classList.add('on'); haptic();
}
